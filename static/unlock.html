<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sugar Orbits">
  <title>Sugar Orbits · Private beta</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/app-icon-180.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="unlock-body">
  <main class="unlock-shell">
    <div class="unlock-brand" aria-label="Sugar Orbits">
      <span class="brand-mark" aria-hidden="true"></span>
      <strong>Sugar Orbits</strong>
    </div>
    <p class="unlock-kicker">private beta</p>
    <form class="unlock-form" action="/auth/app" method="post">
      <label for="access-code">Access code</label>
      <input id="access-code" name="access_code" type="password" autocomplete="current-password" enterkeyhint="go" required autofocus>
      <button type="submit">Enter orbit</button>
    </form>
    <p id="error" class="unlock-error" role="alert">That code did not match. Try again.</p>
  </main>
</body>
</html>
